[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosign"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
solana = ["solana>=0.42", "solders>=0.21", "websockets>=12"]
attest = ["cryptography>=42"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
cosign = "cosign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosign = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
