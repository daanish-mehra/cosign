# Weekly leaderboard: crash-test every model in web/models.txt on the full technique suite,
# rebuild the site from the results and deploy it to Vercel.
#
# Repo secrets: OPENAI_API_KEY, OPENAI_BASE_URL (an OpenAI-compatible endpoint serving the models),
# VERCEL_TOKEN. Optional: VERCEL_ORG_ID + VERCEL_PROJECT_ID to deploy to an existing project.
# The first step fails the run, before anything is installed or any model is called, if a
# required secret is missing.
name: leaderboard

on:
  schedule:
    - cron: "0 14 * * 1"          # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for name in OPENAI_API_KEY OPENAI_BASE_URL VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repo secrets:$missing (nothing was run)"
            exit 1
          fi
          echo "secrets present"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[llm]"

      - name: Read models
        id: models
        run: |
          models=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' web/models.txt | grep -v '^$' \
                   | awk '{ print (index($0, ":") ? $0 : "openai:" $0) }' | paste -sd, -)
          if [ -z "$models" ]; then
            echo "::error::web/models.txt lists no models"
            exit 1
          fi
          echo "list=$models" >> "$GITHUB_OUTPUT"
          echo "models: $models"

      - name: Crash test
        run: |
          cosign matrix --models "${{ steps.models.outputs.list }}" --guards none,recommended \
            --techniques full --out results-leaderboard.json --runs-dir runs

      - name: Build site
        run: python web/build.py --results results-leaderboard.json --traces runs/*/traces.jsonl --out site

      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-results
          path: |
            results-leaderboard.json
            runs/
          retention-days: 90

      - name: Deploy to Vercel
        run: |
          [ -n "$VERCEL_ORG_ID" ] || unset VERCEL_ORG_ID
          [ -n "$VERCEL_PROJECT_ID" ] || unset VERCEL_PROJECT_ID
          npx --yes vercel@39.1.0 deploy site --prod --yes --token "$VERCEL_TOKEN"
