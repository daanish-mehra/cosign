# Crash-test an agent on every PR and comment with the score, the change from the base branch,
# the attack grid and the top three fixes. The comment is updated in place on later pushes.
#
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     cosign:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: ./.github/actions/cosign          # or <owner>/cosign/.github/actions/cosign@<ref>
#           with:
#             command: cosign test --agent naive --guards recommended --trials 3 --json
#
# `command` runs once in the PR checkout and once in a checkout of the base branch. It must print
# cosign JSON on stdout (`cosign test --json`), or write a file named by `results-file`
# (`cosign matrix --out results.json`). API keys for LLM agents go in the job's env.
name: Cosign crash test
description: Crash-test an agent on each PR and comment with its score, the change from the base branch, the attack grid and the top fixes.

inputs:
  command:
    description: Command that produces cosign results (stdout JSON, or a file named by results-file).
    default: cosign test --agent naive --guards recommended --trials 3 --json
  results-file:
    description: Read results from this file (relative to each checkout) instead of the command's stdout.
    default: ""
  install:
    description: Shell run in each checkout before `command`, e.g. "pip install -e .[llm]". Cosign itself is already installed.
    default: ""
  compare:
    description: Also run on the base branch and show the change.
    default: "true"
  comment:
    description: Post or update the PR comment.
    default: "true"
  fail-below:
    description: Fail the job if the PR's score is below this (empty = never fail).
    default: ""
  python-version:
    description: Python to run cosign with.
    default: "3.12"
  github-token:
    description: Token used to post the comment (needs pull-requests write).
    default: ${{ github.token }}

outputs:
  score:
    description: The PR's score (0-100).
    value: ${{ steps.format.outputs.score }}
  limit:
    description: The PR's spend limit in USDC.
    value: ${{ steps.format.outputs.limit }}
  score-delta:
    description: Score change from the base branch (empty without a baseline).
    value: ${{ steps.format.outputs.score_delta }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install cosign
      shell: bash
      env:
        COSIGN_SRC: ${{ github.action_path }}/../../..
      run: python -m pip install --quiet "$COSIGN_SRC"

    - name: Crash test (PR)
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        COMMAND: ${{ inputs.command }}
        RESULTS_FILE: ${{ inputs.results-file }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/cosign-head.json"
        if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
        if [ -n "$RESULTS_FILE" ]; then eval "$COMMAND"; cp "$RESULTS_FILE" "$out"; else eval "$COMMAND" > "$out"; fi

    - name: Crash test (base branch)
      if: inputs.compare == 'true' && github.base_ref != ''
      continue-on-error: true   # no baseline is fine: the comment says so
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        INSTALL: ${{ inputs.install }}
        COMMAND: ${{ inputs.command }}
        RESULTS_FILE: ${{ inputs.results-file }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/cosign-base.json"
        dir="$RUNNER_TEMP/cosign-base"
        git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
        git worktree add --detach "$dir" FETCH_HEAD
        cd "$dir"
        if [ -n "$INSTALL" ]; then eval "$INSTALL"; fi
        if [ -n "$RESULTS_FILE" ]; then eval "$COMMAND"; cp "$RESULTS_FILE" "$out"; else eval "$COMMAND" > "$out"; fi

    - name: Format comment
      id: format
      shell: bash
      env:
        PR_COMMENT: ${{ github.action_path }}/../../../src/cosign/pr_comment.py
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        python "$PR_COMMENT" --head "$RUNNER_TEMP/cosign-head.json" --base "$RUNNER_TEMP/cosign-base.json" \
          --base-name "${BASE_REF:-main}" --out "$RUNNER_TEMP/cosign-comment.md" --github-output "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/cosign-comment.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Post comment
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        body="$RUNNER_TEMP/cosign-comment.json"
        jq -n --rawfile body "$RUNNER_TEMP/cosign-comment.md" '{body: $body}' > "$body"
        id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
               --jq '.[] | select(.body | startswith("<!-- cosign-report -->")) | .id' | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" --input "$body" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" --input "$body" > /dev/null
        fi

    - name: Check score
      if: inputs.fail-below != ''
      shell: bash
      env:
        SCORE: ${{ steps.format.outputs.score }}
        MIN: ${{ inputs.fail-below }}
      run: |
        if [ "$SCORE" -lt "$MIN" ]; then
          echo "::error::cosign score $SCORE is below $MIN"
          exit 1
        fi
